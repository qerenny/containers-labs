apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor

metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: shop
    app.kubernetes.io/part-of: shop

spec:
  selector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - api
          - worker

      - key: app.kubernetes.io/part-of
        operator: In
        values:
          - shop

  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.monitoring.interval }}
