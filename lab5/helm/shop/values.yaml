api:
  replicaCount: 3

  terminationGracePeriodSeconds: 20
  preStopSleepSeconds: 5

  image:
    repository: docker.io/qerenny/lab3-api
    tag: "0.2.0"
    pullPolicy: IfNotPresent

  healthFail: false

  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 100m
      memory: 128Mi

  service:
    type: NodePort
    port: 8080
    nodePort: 30080

worker:
  replicaCount: 2

  image:
    repository: docker.io/qerenny/lab3-worker
    tag: "0.1.0"
    pullPolicy: IfNotPresent

  healthFail: false
  pollInterval: 2s

  service:
    type: ClusterIP
    port: 8080

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 100m
      memory: 128Mi

postgres:
  instances: 1
  storageSize: 1Gi
  port: 5432
  instanceManagerPort: 8000

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

monitoring:
  interval: 15s

  alerts:
    policyDrops:
      window: 2m
      for: 30s
      threshold: 5

    tcpResets:
      window: 2m
      for: 1m
      rateThreshold: 1

    dnsFailures:
      window: 2m
      for: 30s
      threshold: 5

networkPolicy:
  enabled: true

  workloads:
    partOfLabel: shop
    apiLabel: api
    workerLabel: worker
    loadClientLabel: load-client
    postgresLabels:
      app.kubernetes.io/name: postgres
      app.kubernetes.io/part-of: shop

  dns:
    namespaceLabels:
      kubernetes.io/metadata.name: kube-system
    podLabels:
      k8s-app: kube-dns
    port: 53

  prometheus:
    namespaceLabels:
      kubernetes.io/metadata.name: monitoring
    podLabels:
      app.kubernetes.io/name: prometheus

  cnpgOperator:
    namespaceLabels:
      kubernetes.io/metadata.name: cnpg-system
    podLabels:
      app.kubernetes.io/name: cloudnative-pg
      app.kubernetes.io/instance: cnpg

  externalClient:
    entity: world

  kubernetesApi:
    entity: kube-apiserver
    port: 6443
