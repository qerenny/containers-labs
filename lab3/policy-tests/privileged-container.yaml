apiVersion: apps/v1
kind: Deployment

metadata:
  name: privileged-container
  namespace: policy-tests
  labels:
    app.kubernetes.io/name: privileged-container
    app.kubernetes.io/part-of: shop

spec:
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: privileged-container

  template:
    metadata:
      labels:
        app.kubernetes.io/name: privileged-container
        app.kubernetes.io/part-of: shop

    spec:
      securityContext:
        runAsNonRoot: true

      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
          securityContext:
            privileged: true
            allowPrivilegeEscalation: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
