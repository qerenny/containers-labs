apiVersion: apps/v1
kind: Deployment

metadata:
  name: untrusted-registry
  namespace: policy-tests
  labels:
    app.kubernetes.io/name: untrusted-registry
    app.kubernetes.io/part-of: shop

spec:
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: untrusted-registry

  template:
    metadata:
      labels:
        app.kubernetes.io/name: untrusted-registry
        app.kubernetes.io/part-of: shop

    spec:
      securityContext:
        runAsNonRoot: true

      containers:
        - name: untrusted-registry
          image: untrusted.example.com/shop-api:1.0.0
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
