apiVersion: apps/v1
kind: Deployment

metadata:
  name: missing-required-labels
  namespace: policy-tests
  labels:
    app.kubernetes.io/name: missing-required-labels

spec:
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: missing-required-labels

  template:
    metadata:
      labels:
        app.kubernetes.io/name: missing-required-labels

    spec:
      securityContext:
        runAsNonRoot: true

      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
