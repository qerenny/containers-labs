apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy

metadata:
  name: require-standard-labels

spec:
  autogen:
    podControllers:
      controllers:
        - deployments
        - statefulsets
        - daemonsets
        - cronjobs
        - jobs

  validationActions:
    - Deny

  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system
            - kube-public
            - kube-node-lease
            - kyverno
            - monitoring
            - local-path-storage

  validations: 
    - expression: >- 
        has(object.metadata.labels) &&
        'app.kubernetes.io/name' in object.metadata.labels &&
        'app.kubernetes.io/part-of' in object.metadata.labels
        
      message: >-
        Pods must define app.kubernetes.io/name and app.kubernetes.io/part-of labels.