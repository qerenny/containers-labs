apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy

metadata:
  name: disallow-latest-tag

spec:
  autogen:
    podControllers:
      controllers:
        - deployments
        - statefulsets
        - daemonsets
        - cronjobs
        - jobs

  validationActions:
    - Deny

  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system
            - kube-public
            - kube-node-lease
            - kyverno
            - monitoring
            - cnpg-system
            - local-path-storage

  validations: 
      - expression: >- 
          object.spec.containers.all(container,
          !container.image.endsWith(":latest")
          )
          
        message: >-
          Images must not use the mutable latest tag.
