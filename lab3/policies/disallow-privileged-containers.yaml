apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy

metadata:
  name: disallow-privileged-containers

spec:
  autogen:
    podControllers:
      controllers:
        - deployments
        - statefulsets
        - daemonsets
        - cronjobs
        - jobs

  validationActions:
    - Deny

  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system
            - kube-public
            - kube-node-lease
            - kyverno
            - monitoring
            - local-path-storage

  validations: 
    - expression: >- 
        object.spec.containers.all(container,
        !has(container.securityContext) ||
        !has(container.securityContext.privileged) ||
        container.securityContext.privileged == false
        )
        
      message: >-
        Privileged containers are not allowed.
