apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ .Release.Name }}-worker
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/part-of: shop

spec:
  replicas: {{ .Values.worker.replicaCount }}

  selector:
    matchLabels:
      app.kubernetes.io/name: worker
      app.kubernetes.io/part-of: shop

  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
        app.kubernetes.io/part-of: shop

    spec:
      securityContext:
        runAsNonRoot: true

      containers:
        - name: worker
          image: "{{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag }}"
          imagePullPolicy: {{ .Values.worker.image.pullPolicy }}

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          env:
            - name: HTTP_ADDR
              value: ":8080"

            - name: HEALTH_FAIL
              value: {{ .Values.worker.healthFail | quote }}

            - name: POLL_INTERVAL
              value: {{ .Values.worker.pollInterval | quote }}

            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-db-app
                  key: uri

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}