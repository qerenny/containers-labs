api:
  replicaCount: 3
  priorityClassName: shop-critical

  pdb:
    enabled: true
    minAvailable: 2

  image:
    repository: docker.io/qerenny/lab3-api
    tag: "0.2.0"
    pullPolicy: IfNotPresent

  healthFail: false

  resources:
    requests:
      cpu: 100m
      memory: 100Mi
    limits:
      cpu: 100m
      memory: 100Mi

  service:
    type: ClusterIP
    port: 8080

  scheduling:
    mode: topologySpreadConstraints

worker:
  replicaCount: 2

  image:
    repository: docker.io/qerenny/lab3-worker
    tag: "0.1.0"
    pullPolicy: IfNotPresent

  healthFail: false
  pollInterval: 2s

  service:
    type: ClusterIP
    port: 8080

  resources:
    requests:
      cpu: 10m
      memory: 100Mi
    limits:
      cpu: 100m
      memory: 100Mi
      
postgres:
  instances: 1
  storageSize: 1Gi

  priorityClassName: shop-critical
  enablePDB: true

  resources:
    requests:
      cpu: 100m
      memory: 118Mi
    limits:
      cpu: 100m
      memory: 118Mi


batch:
  replicaCount: 6
  priorityClassName: shop-batch


  image:
    repository: docker.io/qerenny/lab4-batch
    tag: "0.1.0"
    pullPolicy: IfNotPresent

  BATCH_MEMORY_MIB: 128
  BATCH_CPU_WORKERS: 2
  resources:
    requests:
      cpu: "2"
      memory: 256Mi
    limits:
      cpu: "3"
      memory: 512Mi


monitoring:
  interval: 15s

priorityClasses:
  critical:
    name: shop-critical
    value: 1000000
  batch:
    name: shop-batch
    value: -1000