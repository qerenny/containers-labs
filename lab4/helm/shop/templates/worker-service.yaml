apiVersion: v1
kind: Service

metadata:
  name: {{ .Release.Name }}-worker
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/part-of: shop

spec:
  type: {{ .Values.worker.service.type }}

  selector:
    app.kubernetes.io/name: worker
    app.kubernetes.io/part-of: shop

  ports:
    - name: http
      port: {{ .Values.worker.service.port }}
      targetPort: http
      protocol: TCP